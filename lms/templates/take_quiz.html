<!DOCTYPE html>
<html>
<head>
    <title>{{ quiz.title }}</title>
</head>
<body>

<h1>{{ quiz.title }}</h1>

<form method="POST">

    {% csrf_token %}

    {% for question in questions %}

        <h3>{{ question.question_text }}</h3>

        <input type="radio"
               name="{{ question.id }}"
               value="{{ question.option1 }}">
        {{ question.option1 }}

        <br>

        <input type="radio"
               name="{{ question.id }}"
               value="{{ question.option2 }}">
        {{ question.option2 }}

        <br>

        <input type="radio"
               name="{{ question.id }}"
               value="{{ question.option3 }}">
        {{ question.option3 }}

        <br>

        <input type="radio"
               name="{{ question.id }}"
               value="{{ question.option4 }}">
        {{ question.option4 }}

        <hr>

    {% endfor %}

    <button type="submit">
        Submit Quiz
    </button>

</form>

</body>
</html>
