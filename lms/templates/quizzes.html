{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">Available Quizzes</h1>

<div class="row">

{% for quiz in quizzes %}

<div class="col-md-4 mb-4">

    <div class="card shadow h-100">

        <div class="card-body">

            <h3>{{ quiz.title }}</h3>

            <p>
                <strong>Course:</strong>
                {{ quiz.course.title }}
            </p>

            <a href="/take-quiz/{{ quiz.id }}/"
               class="btn btn-warning">
                Take Quiz
            </a>

        </div>

    </div>

</div>

{% empty %}

<div class="alert alert-info">
    No quizzes available.
</div>

{% endfor %}

</div>

{% endblock %}
