<div class="col-md-4 mb-4">

    <div class="card shadow h-100 border-0">

        {% if "Python" in course.title %}
        <img src="https://images.unsplash.com/photo-1526379095098-d400fd0bf935"
             class="card-img-top"
             height="220">
        {% elif "Java" in course.title %}
        <img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4"
             class="card-img-top"
             height="220">
        {% elif "React" in course.title %}
        <img src="https://images.unsplash.com/photo-1633356122544-f134324a6cee"
             class="card-img-top"
             height="220">
        {% else %}
        <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3"
             class="card-img-top"
             height="220">
        {% endif %}

        <div class="card-body">

            <span class="badge bg-success mb-2">
                Beginner Friendly
            </span>

            <span class="badge bg-warning text-dark mb-2">
                ⭐ 4.8 Rating
            </span>

            <h4 class="card-title">
                {{ course.title }}
            </h4>

            <p class="card-text">
                {{ course.description }}
            </p>

            <a href="/enroll/{{ course.id }}/"
               class="btn btn-primary">
                Enroll Now
            </a>

        </div>

    </div>

</div>
